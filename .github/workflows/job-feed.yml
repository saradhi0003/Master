name: Job feed

# Rebuilds jobs.json every hour, force-pushes it as a single commit to the
# `job-feed` branch (so the main branch history stays clean), and redeploys
# GitHub Pages when Pages is set to "GitHub Actions".
on:
  schedule:
    - cron: "17 * * * *" # hourly; off the top of the hour, when GitHub queues are busiest
  workflow_dispatch:
  push:
    paths:
      - index.html
      - config/**
      - scripts/fetch_jobs.py
      - .github/workflows/job-feed.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: job-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.target.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Decide what this run publishes
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null) || build_type=""
          publish=false
          deploy=false
          # Only the default branch owns the shared feed; other branches just dry-run the fetch.
          if [ "$GITHUB_REF_NAME" = "$default_branch" ]; then
            publish=true
            [ "$build_type" = "workflow" ] && deploy=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "branch=$GITHUB_REF_NAME default=$default_branch pages=${build_type:-off} publish=$publish deploy=$deploy"

      - name: Load the previous feed
        run: |
          mkdir -p _feed
          if git fetch --quiet --depth=1 origin job-feed 2>/dev/null; then
            git show FETCH_HEAD:jobs.json > _feed/previous.json
          else
            echo "No job-feed branch yet; starting fresh."
          fi

      - name: Fetch and score jobs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: >-
          python scripts/fetch_jobs.py
          --config config/search.json
          --previous _feed/previous.json
          --out _feed/jobs.json

      - name: Publish to the job-feed branch
        if: steps.target.outputs.publish == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          blob=$(git hash-object -w _feed/jobs.json)
          tree=$(printf '100644 blob %s\tjobs.json\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "Job feed $(date -u +%Y-%m-%dT%H:%MZ)")
          git push --force origin "$commit:refs/heads/job-feed"

      - name: Assemble the Pages site
        if: steps.target.outputs.deploy == 'true'
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp _feed/jobs.json _site/data/jobs.json

      - uses: actions/upload-pages-artifact@v3
        if: steps.target.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
